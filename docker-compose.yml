version: '3.8'

services:
  # PHP-FPM Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wbs-app
    restart: unless-stopped
    volumes:
      - ./:/var/www
      - ./.env:/var/www/.env
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
    networks:
      - wbs-network
    depends_on:
      db:
        condition: service_healthy

  # Nginx Web Server
  nginx:
    image: nginx:alpine
    container_name: wbs-nginx
    restart: unless-stopped
    ports:
      - "8001:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/conf.d/:/etc/nginx/conf.d/:ro
    networks:
      - wbs-network
    depends_on:
      - app

  # Queue Worker
  queue:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wbs-queue
    restart: unless-stopped
    command: php artisan queue:work --sleep=3 --tries=3 --max-jobs=1000
    volumes:
      - ./:/var/www
      - ./.env:/var/www/.env
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
    networks:
      - wbs-network
    depends_on:
      - app

  # MySQL Database
  db:
    image: mysql:8.0
    container_name: wbs-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - wbs-network
    command: --default-authentication-plugin=mysql_native_password --skip-ssl --max_connections=1000
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Redis Cache & Session
  redis:
    image: redis:7-alpine
    container_name: wbs-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - wbs-network

networks:
  wbs-network:
    driver: bridge

volumes:
  db_data:
  redis_data:
