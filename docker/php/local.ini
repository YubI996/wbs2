; ===================================
; WBS v2 - Local PHP Configuration
; Production Server Overrides
; ===================================

; File Upload Limits (for Aduan attachments)
upload_max_filesize = 40M
post_max_size = 40M

; Memory and Execution
memory_limit = 512M
max_execution_time = 600

; Session
session.gc_maxlifetime = 28800

; Timezone
date.timezone = Asia/Makassar
